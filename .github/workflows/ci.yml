name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend (Node.js / Fastify) ──────────────────────────────
  api-ci:
    name: API — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Worker (Go) ──────────────────────────────────────────────
  worker-ci:
    name: Worker — vet, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true
          cache-dependency-path: worker/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # ── Frontend (Next.js at repo root) ─────────────────────────
  frontend-ci:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com
          NEXT_PUBLIC_WS_URL: wss://placeholder.example.com

  # ── Cloudflare Worker (Durable Objects) ─────────────────────
  cf-worker-ci:
    name: CF Worker — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck --if-present || npx tsc --noEmit
