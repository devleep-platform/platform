name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  ACR: devopslabprod.azurecr.io
  APP_NAME: devops-lab-prod-api
  RG: devops-lab-prod-rg

jobs:
  build:
    name: Build and push API image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name devopslabprod

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.ACR }}/api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  migrate:
    name: Run DB migrations
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Run migrations
        working-directory: backend
        run: npx tsx src/db/run-migrations.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy to production
    needs: [build, migrate]
    runs-on: ubuntu-latest

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current image for rollback
        run: |
          CURRENT=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "ROLLBACK_IMAGE=$CURRENT" >> $GITHUB_ENV
          echo "Current image: $CURRENT"

      - name: Deploy new image
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --image "${{ env.ACR }}/api@${{ needs.build.outputs.digest }}"

      - name: Health check
        id: health
        run: |
          API_URL=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Checking https://$API_URL/health"
          for i in $(seq 1 18); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" "https://$API_URL/health" 2>/dev/null || echo "000")
            echo "Attempt $i/18: HTTP $HTTP"
            [[ "$HTTP" == "200" ]] && exit 0
            sleep 10
          done
          echo "Health check failed after 3 minutes"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Rolling back to: ${{ env.ROLLBACK_IMAGE }}"
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --image "${{ env.ROLLBACK_IMAGE }}"
          echo "Rollback complete"
