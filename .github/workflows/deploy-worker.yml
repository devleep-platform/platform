name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR: devopslabprod.azurecr.io
  APP_NAME: devops-lab-prod-worker
  RG: devops-lab-prod-rg

jobs:
  build:
    name: Build and push Worker image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name devopslabprod

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          push: true
          tags: ${{ env.ACR }}/worker:sha-${{ github.sha }}
          # GHA cache: provider download (14 min) → cache hit (~2 min)
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current image for rollback
        run: |
          CURRENT=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "ROLLBACK_IMAGE=$CURRENT" >> $GITHUB_ENV
          echo "Current image: $CURRENT"

      - name: Deploy new image
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --image "${{ env.ACR }}/worker@${{ needs.build.outputs.digest }}"

      - name: Wait for healthy revision
        id: health
        run: |
          for i in $(seq 1 20); do
            STATE=$(az containerapp revision list \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RG }} \
              --query "sort_by([].{name:name,ts:properties.createdTime}, &ts)[-1].properties.healthState" \
              -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $i/20: $STATE"
            [[ "$STATE" == "Healthy" ]] && exit 0
            sleep 15
          done
          echo "Worker did not become healthy in 5 minutes"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Rolling back to: ${{ env.ROLLBACK_IMAGE }}"
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RG }} \
            --image "${{ env.ROLLBACK_IMAGE }}"
          echo "Rollback complete"
